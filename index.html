<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BsBus - GPS</title>
<link rel="icon" href="icons/logo/onibus-bsbus.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--cor-bsbus:#4dff00;--cor-prefixo-7:#e1b74b;--surface:rgba(255,255,255,.95);--surface-solid:#fff;--text-main:#1e293b;--text-sec:#64748b;--border:rgba(0,0,0,.15);--shadow:0 4px 20px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent}
body,html{height:100%;width:100%;overflow:hidden;background:#e5e5e5}
#map{height:100%;width:100%;z-index:0}
.leaflet-control-attribution{display:none!important}
.top-bar{position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:94%;max-width:400px;z-index:1000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.top-bar>*{pointer-events:auto}
.search-container{background:#fff;width:100%;height:48px;display:flex;align-items:center;padding:0 15px;border-radius:24px;position:relative;box-shadow:var(--shadow);margin-top:8px;}
#search{flex:1;border:none;background:transparent;font-size:16px;outline:none;height:100%;color:var(--text-main);font-weight:500;margin-left:10px;padding-right:30px}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;background:rgba(128,128,128,.2);border-radius:50%;display:none;justify-content:center;align-items:center;cursor:pointer;color:var(--text-sec);font-size:12px;font-weight:800}
.search-clear.visible{display:flex}
.search-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;width:70vw}
.tag{background:var(--text-main);color:#fff;font-size:11px;padding:4px 10px;border-radius:20px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:background .2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.tag:hover{background:#ff4d4d}
.suggestions{background:#fff;margin-top:5px;border-radius:12px;max-height:45vh;overflow-y:auto;display:none;box-shadow:var(--shadow);color:var(--text-main);width:100%}
.suggestion-item{padding:12px 15px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;display:flex;justify-content:space-between}
.suggestion-item.highlighted,.suggestion-item:hover{background:rgba(37,99,235,.15);color:var(--primary);font-weight:700}
.leaflet-top.leaflet-left{top:max(10px,env(safe-area-inset-top))!important;left:15px!important;z-index:1000}
.leaflet-control-layers{border-radius:12px!important;box-shadow:var(--shadow)!important;background:var(--surface)!important;border:1px solid rgba(0,0,0,.1)!important}
.applied-filters-stack{position:absolute;right:15px;bottom:120px;z-index:999;display:flex;flex-direction:column;align-items:flex-end;gap:5px;max-height:calc(100vh - 200px);overflow-y:auto;pointer-events:none}
.applied-tag{pointer-events:auto;background:#0f172a;color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:10px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);cursor:pointer}
.applied-tag:hover{background:#ef4444}

/* Botões do canto inferior direito (Cascata de controles) */
.toggle-controls-group{position:absolute;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 50px);right:15px;z-index:1000;display:flex;flex-direction: column;gap:8px;}
.toggle-stops-btn{background:#fff;padding:8px 12px;border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content: space-around;gap:6px;font-weight:700;font-size:12px;color:var(--text-main)}
.btn-filter-toggle{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));right:15px;z-index:1000;background:#0f172a;color:#fff;border:none;padding:10px 16px;border-radius:24px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);cursor:pointer}

.control-panel{position:absolute;bottom:max(70px,env(safe-area-inset-bottom));right:15px;width:440px;max-height:calc(100vh - 100px);background:#fff;padding:16px;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border);z-index:1001;display:none;flex-direction:column;gap:10px;overflow-y:auto}
.control-panel.open{display:flex}
.panel-header,.filter-section-header{display:flex;justify-content:space-between;align-items:center}
.panel-header{border-bottom:1px solid #f1f5f9;padding-bottom:6px}
.filter-section-header{margin-bottom:6px}
.panel-title{font-size:12px;font-weight:800;color:var(--text-sec);text-transform:uppercase}
.panel-close{cursor:pointer;font-weight:800;font-size:15px;color:var(--text-sec);padding:4px}
.btn-action-group{display:inline-flex;gap:4px;background:#e2e8f0;padding:2px;border-radius:6px}
.btn-action-chip{background:#fff;border:none;font-size:10px;font-weight:700;color:var(--text-main);cursor:pointer;padding:2px 7px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn-action-chip:hover{background:#0f172a;color:#fff}
.sectors-layout-table{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#f8fafc;padding:10px;border-radius:10px;border:1px solid #e2e8f0}
.sectors-column-title{font-size:11px;font-weight:800;color:#0f172a;text-transform:uppercase}
.filter-list{display:flex;flex-direction:column;gap:4px}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.filter-item{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-main)}
.filter-item input{width:16px;height:16px;accent-color:var(--cor-bsbus);cursor:pointer}
.divider{height:1px;background:#eee;margin:4px 0}
.leaflet-popup-content-wrapper{background:#fff;border-radius:14px;padding:0;box-shadow:var(--shadow);overflow:hidden}
.leaflet-popup-content{margin:0!important;width:235px!important;text-align:center}
.p-header{padding:6px 10px;font-weight:800;text-align:center;background:#f1f5f9;border-bottom:3px solid var(--cor-bsbus);font-size:14px;color:var(--text-main)}
.p-header.p7{border-bottom-color:var(--cor-prefixo-7)!important}
.p-body{padding:10px 15px;font-size:12px}
.p-row{display:flex;justify-content:space-between;margin-bottom:2px}
.p-label{color:var(--text-sec);font-weight:500;text-align:left}
.p-val{font-weight:700;color:#000;text-align:right}
.icon-map{display:flex;flex-direction:column;align-items:center;pointer-events:none}
.placa-azul-map{display:flex;background:#385EA9;width:32px;height:37px;justify-content:center;align-items:center;border-radius:4px;pointer-events:auto}
.borda-map{display:flex;align-items:center;justify-content:center;border:1px solid #fff;border-radius:2px;height:90%;width:90%}
.info-placa-map{display:flex;align-items:center;justify-content:center;background:#fff;width:21px;height:19px;margin-bottom:5px;font-size:11px;font-weight:700;border-radius:1px;color:#000}
.poste-map{width:4px;height:10px;background:#000}
.popup-parada .leaflet-popup-content{width:auto!important;min-width:220px;max-width:min(350px,75vw);padding:10px 18px!important;text-align:center;color:#000!important;font-weight:400!important}
.toggle-label{font-size:12px;font-weight:600;color:#333}
.switch{position:relative;display:inline-block;width:38px;height:20px}
.switch input{display:none}
.slider{position:absolute;cursor:pointer;inset:0;background:#ccc;transition:.3s;border-radius:34px}
.slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background:#fff;transition:.3s;border-radius:50%}
input:checked+.slider{background:var(--cor-bsbus)}
input:checked+.slider:before{transform:translateX(18px)}

@media(max-width:600px){
  .top-bar{left: calc(50% + 35px); width: calc(100% - 90px); max-width: none;}
  .control-panel{
    width: calc(100% - 30px);
    top: max(10px, env(safe-area-inset-top));
    bottom: auto;
    max-height: calc(100dvh - 80px);
  }
  .sectors-layout-table{grid-template-columns:1fr}
  .search-tags{width:94vw;max-width:94%}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="top-bar">
  <div class="search-container">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--text-sec);flex:none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="search" placeholder="Linha ou prefixo..." autocomplete="off">
    <div class="search-clear" id="btn-search-clear" onclick="limparBuscaInput()">✕</div>
  </div>
  <div id="search-tags" class="search-tags"></div>
  <div id="suggestions" class="suggestions"></div>
</div>

<div class="applied-filters-stack" id="applied-filters-stack"></div>

<!-- Botões de Controle em CASCATA no Canto Inferior Direito -->
<div class="toggle-controls-group">
  <div class="toggle-stops-btn">
    <span class="toggle-label">Paradas</span>
    <label class="switch"><input type="checkbox" id="chk-show-stops"><span class="slider"></span></label>
  </div>
  <div class="toggle-stops-btn">
    <span class="toggle-label">Terminais</span>
    <label class="switch"><input type="checkbox" id="chk-show-terminals"><span class="slider"></span></label>
  </div>
</div>

<button class="btn-filter-toggle" id="btn-toggle-filters">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
  Filtros e Setores
</button>

<div class="control-panel" id="control-panel">
  <div class="panel-header"><span class="panel-title">Filtros Operacionais</span><span class="panel-close" id="btn-close-panel">✕</span></div>
  <div class="sectors-layout-table">
    <div>
      <div class="filter-section-header"><span class="sectors-column-title">Garagens</span>
        <div class="btn-action-group"><button class="btn-action-chip" onclick="setGroupCheckboxes('.chk-manutencao',true)">Todos</button><button class="btn-action-chip" onclick="setGroupCheckboxes('.chk-manutencao',false)">Nenhum</button></div></div>
      <div class="filter-list" id="filters-manutencao"></div>
    </div>
    <div>
      <div class="filter-section-header"><span class="sectors-column-title">Operação</span>
        <div class="btn-action-group"><button class="btn-action-chip" onclick="setGroupCheckboxes('.chk-operacao',true)">Todos</button><button class="btn-action-chip" onclick="setGroupCheckboxes('.chk-operacao',false)">Nenhum</button></div></div>
      <div class="filter-list" id="filters-operacao"></div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="filter-section-header"><span class="panel-title">Modelos de Ônibus</span>
    <div class="btn-action-group"><button class="btn-action-chip" onclick="setGroupCheckboxes('.chk-modelo',true)">Todos</button><button class="btn-action-chip" onclick="setGroupCheckboxes('.chk-modelo',false)">Nenhum</button></div></div>
  <div class="filter-list" id="filters-modelo"></div>
  <div class="divider"></div>
  <div class="filter-section-header"><span class="panel-title">Status Operacional</span>
    <div class="btn-action-group"><button class="btn-action-chip" onclick="setGroupCheckboxes('.chk-status',true)">Todos</button><button class="btn-action-chip" onclick="setGroupCheckboxes('.chk-status',false)">Nenhum</button></div></div>
  <div class="filter-grid">
    <label class="filter-item"><input type="checkbox" class="chk-status" id="chk-com-linha" checked> Com Linha</label>
    <label class="filter-item"><input type="checkbox" class="chk-status" id="chk-sem-linha" checked> Sem Linha</label>
    <label class="filter-item"><input type="checkbox" class="chk-status" id="chk-transferencia" checked> Transf.</label>
    <label class="filter-item"><input type="checkbox" class="chk-status" id="chk-VNR" checked> VNR</label>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

const itinerarioCache = new Map();

// ---- filtros (gerados por JS) ----
const MD = {B3:'Básico (3 portas)',B4:'Básico Porta Esquerda (4 portas)',A3:'Antigo Básico (3 portas)',A4:'Antigo Básico Porta Esquerda (4 portas)',MN:'MINI (Zebrinha)'};
const chk = (cls, val, label, style) => `<label class="filter-item"${style ? ` style="${style}"` : ''}><input type="checkbox" class="${cls}" value="${val}" checked> ${label}</label>`;
document.getElementById('filters-manutencao').innerHTML = ['Brazlândia','Pinheiros','QNR','Setor O','Guará','Recanto das Emas'].map(g => chk('chk-manutencao', g, g === 'Recanto das Emas' ? 'Recanto' : g)).join('');
document.getElementById('filters-operacao').innerHTML = ['Brazlândia','Pinheiros','Estrutural','QNR','M Norte','Setor O','Guará','Riacho Fundo','Samambaia','Recanto das Emas','Reserva'].map(o => o === 'Reserva' ? chk('chk-operacao', o, '<b>Reserva</b>', 'color:#b91c1c;') : chk('chk-operacao', o, o === 'Recanto das Emas' ? 'Recanto' : o)).join('');
document.getElementById('filters-modelo').innerHTML = [[MD.B3,'Básico (3 portas)'],[MD.B4,'Básico P. Esquerda (4 portas)'],[MD.A3,'Antigo Básico (3 portas)'],[MD.A4,'Antigo P. Esquerda (4 portas)'],[MD.MN,'MINI (Zebrinha)']].map(m => chk('chk-modelo', m[0], m[1])).join('');

// ---- paradas / terminais / camadas ----
const chkStops = document.getElementById('chk-show-stops');
chkStops.checked = localStorage.getItem('showStops') === 'true';
chkStops.addEventListener('change', (e) => { localStorage.setItem('showStops', e.target.checked); triggerRenderLines(); });

const chkTerminals = document.getElementById('chk-show-terminals');
if (chkTerminals) {
  chkTerminals.checked = localStorage.getItem('showTerminals') === 'true';
  chkTerminals.addEventListener('change', (e) => {
    localStorage.setItem('showTerminals', e.target.checked);
    if (typeof window.renderTerminais === 'function') window.renderTerminais();
  });
}

const savedLayer = localStorage.getItem('lastMapLayer') || "Padrão";
const tiles = {
  "Padrão": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22, maxNativeZoom: 19 }),

let markers = {}, busDataRaw = [], activeRouteLayers = [], activeStops = [], termosBusca = [];
let itemSelecionado = null, highlightedIndex = -1, currentOpenPopup = null, renderLinesToken = 0, debounceRenderTimer = null;

function setGroupCheckboxes(selector, checked) {
  document.querySelectorAll(selector).forEach(c => c.checked = checked);
  render(); triggerRenderLines(); updateAppliedFiltersBadgeStack();
}

// ---- especificações do veículo ----
function getVehicleCore(prefixo) {
  if (!prefixo) return null;
  const p = String(prefixo).trim();
  if (p.toUpperCase() === "VNR") return "VNR";
  if (p.startsWith('7') && p.length >= 6) return parseInt(p.substring(1, p.length - 1), 10);
  if (p.startsWith('50') && p.length >= 5) return parseInt(p.substring(2, p.length - 1), 10);
  const n = parseInt(p.replace(/\D/g, ''), 10);
  return isNaN(n) ? null : n;
}

  [1094,1094,'A3','Setor O','Setor O'],[1093,1097,'A3','Setor O','Estrutural'],[1098,1100,'A3','Setor O','Reserva'],
  [1101,1101,'A3','Brazlândia','Reserva'],[1102,1129,'A3','Brazlândia','Brazlândia'],
  [1130,1131,'MN','Guará','Estrutural'],[1132,1132,'MN','Guará','Reserva']
];
const RIACHO_FUNDO = [385,386,413,420,421,423,425,430];
const SAMAMBAIA = [387,388,389,390,391,392,393,394,396,422,431,435,436,437,439,443,444,449];

function getVehicleSpecs(prefixo) {
  const core = getVehicleCore(prefixo);
  if (core === "VNR") return { modelo: "Veículo Não Regular", manutencao: "Outro", operacao: "Reserva", core: "VNR" };
  if (core === null) return { modelo: "Indefinido", manutencao: "Outro", operacao: "Outro", core: "--" };
  if (core >= 385 && core <= 459) {
    let op = 'Recanto das Emas';
    if (core >= 453) op = 'Reserva';
    else if (RIACHO_FUNDO.includes(core)) op = 'Riacho Fundo';
    else if (SAMAMBAIA.includes(core)) op = 'Samambaia';
    return { modelo: MD.B3, manutencao: 'Recanto das Emas', operacao: op, core };
  }
  const r = REGRAS.find(x => core >= x[0] && core <= x[1]);
  return r ? { modelo: MD[r[2]], manutencao: r[3], operacao: r[4], core } : { modelo: "Outro", manutencao: "Outro", operacao: "Outro", core };
}

// ---- utilitários ----
function decodePolyline(encoded) {
  if (!encoded) return [];
  let poly = [], index = 0, len = encoded.length, lat = 0, lng = 0;
  while (index < len) {
    let b, shift = 0, result = 0;
    do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += ((result & 1) ? ~(result >> 1) : (result >> 1));
    shift = 0; result = 0;
    do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lng += ((result & 1) ? ~(result >> 1) : (result >> 1));
    poly.push([lat / 1e5, lng / 1e5]);
  }
  return poly;
}
function parseDateBR(d, h) { if (!d) return new Date(); const p = d.split('/'); return new Date(`${p[2]}-${p[1]}-${p[0]}T${h}`); }
function getLiveStatus(d, h) {
  let diff = Math.floor((new Date() - parseDateBR(d, h)) / 1000);
  if (diff < 0) diff = 0;
  const dd = Math.floor(diff / 86400), hh = Math.floor((diff % 86400) / 3600), mm = Math.floor((diff % 3600) / 60), ss = diff % 60;
  if (dd > 0) return `${dd}d ${hh}h ${mm}m ${ss}s atrás`;
  if (hh > 0) return `${hh}h ${mm}m ${ss}s atrás`;
  if (mm > 0) return `${mm}min ${ss}seg atrás`;
  return `${ss} seg atrás`;
}
function createStopIcon(n) {
  return L.divIcon({ className: '', html: `<div class="icon-map" style="pointer-events:auto"><div class="placa-azul-map"><div class="borda-map"><div class="info-placa-map">${n}</div></div></div><div class="poste-map"></div></div>`, iconSize: [32, 47], iconAnchor: [16, 47], popupAnchor: [0, -40] });
}

// ---- busca ----
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', (e) => {

  if (!val) { document.getElementById('suggestions').style.display = 'none'; return; }
  const live = busDataRaw.flatMap(v => [v.linha, v.prefixo]);
  const matches = Array.from(new Set([...TODAS_LINHAS_EMPRESA, ...live])).filter(x => x && String(x).toLowerCase().includes(val))
    .sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true })).slice(0, 30);
  document.getElementById('suggestions').innerHTML = matches.map((m, i) => `<div class="suggestion-item" data-index="${i}" onclick="selectSuggestion('${m}')"><span>${m}</span></div>`).join('');
  document.getElementById('suggestions').style.display = matches.length ? 'block' : 'none';
});
searchInput.addEventListener('keydown', (e) => {
  const items = document.getElementById('suggestions').getElementsByClassName('suggestion-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); highlightedIndex = (highlightedIndex + 1) % items.length; updateHighlight(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); highlightedIndex = (highlightedIndex - 1 + items.length) % items.length; updateHighlight(items); }
  else if (e.key === 'Enter') { e.preventDefault(); if (highlightedIndex > -1 && items[highlightedIndex]) items[highlightedIndex].click(); else if (items.length > 0) items[0].click(); }
  else if (e.key === 'Escape') limparBuscaInput();
});
function updateHighlight(items) {
  Array.from(items).forEach((el, i) => { el.classList.toggle('highlighted', i === highlightedIndex); if (i === highlightedIndex) el.scrollIntoView({ block: 'nearest' }); });
}
function selectSuggestion(val) {

}
function removerTag(e, val) {

// ---- traçados ----
async function fetchItinerarioData(linha) {
  if (!linha || linha === "0.001") return null;
  if (itinerarioCache.has(linha)) return itinerarioCache.get(linha);
  try {
    const res = await fetch(`https://gps-bsbus.vercel.app/itinerario/${linha}`);
    const data = await res.json();
    if (data && data.itinerarios) { itinerarioCache.set(linha, data); return data; }
  } catch (err) { console.error(`Erro no itinerario da linha ${linha}:`, err); }
  return null;
}
function clearRouteLayers() {
  activeRouteLayers.forEach(l => map.removeLayer(l)); activeRouteLayers = [];
  activeStops.forEach(s => map.removeLayer(s)); activeStops = [];
}
function triggerRenderLines() { clearTimeout(debounceRenderTimer); debounceRenderTimer = setTimeout(renderLines, 100); }

function addStops(itin, linha) {
  if (!document.getElementById('chk-show-stops').checked || !itin.stops) return;
  itin.stops.forEach((stop, idx) => {
    const s = L.marker([stop.lat, stop.lng], { icon: createStopIcon(idx + 1), zIndexOffset: 500 });
    s.bindPopup(`<b>Parada ${idx + 1} | Linha ${linha}</b><br>${stop.name}`, { className: 'popup-parada', minWidth: 200, maxWidth: 350, autoPan: false });
    hoverPopup(s);
    s.addTo(map); activeStops.push(s);
  });
}

async function renderLines() {
  const token = ++renderLinesToken;
  clearRouteLayers();

  if (itemSelecionado && itemSelecionado.linha) {
    const data = await fetchItinerarioData(itemSelecionado.linha);
    if (token !== renderLinesToken || !data || !data.itinerarios) return;
    const dir = String(itemSelecionado.sentido).toLowerCase().includes('volta') ? 1 : 0;
    const itin = data.itinerarios.find(i => i.directionId === dir) || data.itinerarios[0];
    if (itin && itin.shape) {
      const c = decodePolyline(itin.shape);
      activeRouteLayers.push(L.polyline(c, { color: '#000', weight: 8, opacity: 1, interactive: false }).addTo(map),
                             L.polyline(c, { color: BSBUS_GREEN, weight: 4, opacity: 1, interactive: false }).addTo(map));
      addStops(itin, itemSelecionado.linha);
    }
    return;
  }

  if (termosBusca.length !== 1) return;
  const t = termosBusca[0];
  let linha = TODAS_LINHAS_EMPRESA.find(l => l === t || l.includes(t));
  if (!linha) { const m = busDataRaw.find(v => v.linha && v.linha.includes(t)); if (m) linha = m.linha; }
  if (!linha) return;

  const data = await fetchItinerarioData(linha);
  if (token !== renderLinesToken || !data || !data.itinerarios) return;
  data.itinerarios.forEach(itin => {
    if (itin.shape) {
      const c = decodePolyline(itin.shape);
      activeRouteLayers.push(L.polyline(c, { color: '#000', weight: 6, opacity: 1, interactive: false }).addTo(map),
                             L.polyline(c, { color: itin.directionId === 0 ? BSBUS_GREEN : '#38bdf8', weight: 3.5, opacity: 1, interactive: false }).addTo(map));
    }
    addStops(itin, linha);
  });
}

// ---- dados ----
async function fetchData() {
  try {
    const r = await fetch(API_URL, { cache: 'no-store' });
    const json = await r.json();
    busDataRaw = json.veiculos || [];
    render();
  } catch (e) { console.error("Erro ao buscar dados:", e); }
}

// ---- filtros aplicados (tags) ----
function updateAppliedFiltersBadgeStack() {
  const stack = document.getElementById('applied-filters-stack');
  stack.innerHTML = '';
  [['.chk-manutencao', 'Garagem'], ['.chk-operacao', 'Op'], ['.chk-modelo', 'Mod']].forEach(([sel, nome]) => {
    const all = document.querySelectorAll(sel), on = document.querySelectorAll(sel + ':checked');
    if (on.length > 0 && on.length < all.length) on.forEach(c => {
      const b = document.createElement('div');
      b.className = 'applied-tag'; b.innerHTML = `${nome}: ${c.value} ✕`;
      b.onclick = () => { c.checked = false; render(); triggerRenderLines(); updateAppliedFiltersBadgeStack(); };
      stack.appendChild(b);
    });
  });
}

function hoverPopup(m, o) {
  m.off('click', m._openPopup, m);
  m.on('click', () => { m.openPopup(); m._pin = true; });
  m.on('popupclose', () => { m._pin = false; });
}

function limparSelecao() {
  const tinha = !!itemSelecionado;
  itemSelecionado = null; map.closePopup(); currentOpenPopup = null;
  if (tinha) { clearRouteLayers(); render(); triggerRenderLines(); }
}

// ---- eventos do mapa ----
map.on('click', () => { controlPanel.classList.remove('open'); limparSelecao(); });
map.on('dblclick', () => {
  itemSelecionado = null; controlPanel.classList.remove('open'); map.closePopup(); currentOpenPopup = null;
  clearRouteLayers(); render(); triggerRenderLines();
});
setInterval(() => {
  for (const id in markers) {
    const el = document.getElementById(`stat-${id}`);
    if (el && markers[id].vData) el.innerText = getLiveStatus(markers[id].vData.data, markers[id].vData.hora);
  }
}, 1000);
document.querySelectorAll('.control-panel input[type=checkbox]').forEach(c => c.addEventListener('change', () => { render(); triggerRenderLines(); updateAppliedFiltersBadgeStack(); }));

fetchData();
updateAppliedFiltersBadgeStack();
setInterval(fetchData, 10000);
</script>

        while (ativos < max && prox < linhas.length) {

      };

    });
  }

  function distM(lat, lng, coords, parar) {
    const rad = Math.PI / 180, R = 6371000;
    const kx = Math.cos(lat * rad) * R * rad, ky = R * rad;
    let min = Infinity;
    for (let i = 0; i < coords.length - 1; i++) {
      const ax = (coords[i][1] - lng) * kx, ay = (coords[i][0] - lat) * ky;
      const bx = (coords[i + 1][1] - lng) * kx, by = (coords[i + 1][0] - lat) * ky;
      if ((ax > min && bx > min) || (ax < -min && bx < -min) || (ay > min && by > min) || (ay < -min && by < -min)) continue;
      const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
      let t = len2 ? -(ax * dx + ay * dy) / len2 : 0;
      t = Math.max(0, Math.min(1, t));
      const d = Math.hypot(ax + t * dx, ay + t * dy);
      if (d < min) { min = d; if (parar !== undefined && min <= parar) return min; }
    }
    return min;
  }

  function verificar(v) {
    const linha = linhaRota(v);
    if (!linha) { delete statusRota[v.prefixo]; return; }
    const dir = dirDe(v);
    let s = statusRota[v.prefixo];
    if (!s || s.linha !== linha || s.dir !== dir) s = statusRota[v.prefixo] = { linha, dir, cont: 0, fora: false, motivo: null, dist: 0, semItin: false };
    if (!Number.isFinite(v.latitude) || !Number.isFinite(v.longitude)) return;
    const coords = shapeDe(linha, dir);
    if (!coords) { s.semItin = true; s.fora = false; s.cont = 0; return; }
    s.semItin = false;
    const d = distM(v.latitude, v.longitude, coords, RAIO_FORA_ROTA_M);
    s.dist = d;
    if (d > RAIO_FORA_ROTA_M) {
      s.cont++; s.motivo = 'rota';
      const op = shapeDe(linha, 1 - dir);
      if (op && distM(v.latitude, v.longitude, op, RAIO_SENTIDO_INVERTIDO_M) <= RAIO_SENTIDO_INVERTIDO_M) s.motivo = 'sentido';
    } else { s.cont = 0; s.motivo = null; }
    s.fora = s.cont >= LEITURAS_PARA_ALERTA;
  }

  function checarRotas() {
    if (checando) { pendente = true; return; }
    checando = true;
    const lista = busDataRaw.slice();
    const vivos = new Set(lista.map((v) => v.prefixo));
    Object.keys(statusRota).forEach((p) => { if (!vivos.has(p)) delete statusRota[p]; });

    const agora = Date.now();
    const faltam = Array.from(new Set(lista.map(linhaRota).filter(Boolean)))
      .filter((l) => !itinerarioCache.has(l) && !(falhas.has(l) && agora - falhas.get(l) < RETRY_FALHA_MS));

    const conferir = () => emFatias(lista, verificar,
      (i, n) => { progresso = i < n ? 'Verificando ' + i + '/' + n + '…' : ''; subTexto(); },
      finalizar);

    if (faltam.length) { progresso = 'Baixando ' + faltam.length + ' itinerário(s)…'; subTexto(); baixar(faltam, DOWNLOADS_SIMULTANEOS).then(conferir); }
    else conferir();
  }

  function finalizar() {
    const r = { ok: 0, fora: 0, sentido: 0, semlinha: 0, outros: 0, semItin: 0 };
    busDataRaw.forEach((v) => {
      const e = estadoDe(v);
      if (e === 'ok') { const s = statusRota[v.prefixo]; if (s && s.semItin) r.semItin++; else r.ok++; }
      else if (e === 'fora') r.fora++;
      else if (e === 'sentido') r.sentido++;
      else if (e === 'semlinha') r.semlinha++;
      else r.outros++;
    });
    resumo = r; ultimaVerificacao = Date.now(); progresso = '';
    checando = false;
    window.render();
    atualizarPainel();
    if (pendente) { pendente = false; checarRotas(); }
  }

  // =====================================================================
  //  ÍCONES / MARCADORES
  // =====================================================================
  window.busImgFallback = function (img) {
    img.onerror = null;
    img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect x="11" y="3" width="18" height="34" rx="5" fill="#16a34a" stroke="#000" stroke-width="2"/><rect x="14" y="6" width="12" height="7" rx="2" fill="#bbf7d0"/><rect x="14" y="26" width="12" height="6" rx="2" fill="#bbf7d0"/></svg>');
    img.style.transform = 'rotate(' + (img.dataset.rot || 0) + 'deg)';
  };

  function rumoEntre(a, b) {
    const r = Math.PI / 180, p1 = a[0] * r, p2 = b[0] * r, dl = (b[1] - a[1]) * r;
    const y = Math.sin(dl) * Math.cos(p2);
    const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
    return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
  }

  function headingDe(v, pos) {
    const h0 = heads[v.prefixo];
    const deg = parseFloat(v.direcao);
    let h;
    if (!isNaN(deg)) h = (((90 - deg) % 360) + 360) % 360;
    else if (h0) { const d = map.distance(h0.pos, pos); h = (d >= MIN_MOVE_M && d < 200) ? rumoEntre(h0.pos, pos) : h0.heading; }
    else h = 0;
    if (!h0 || map.distance(h0.pos, pos) >= MIN_MOVE_M) heads[v.prefixo] = { pos, heading: h };
    else h0.heading = h;
    return h;
  }

  function buildIcon(v, estado, ang, tipo, pasta) {
    const linha = linhaTxt(v), txt = linha ? linha + ' / ' + v.prefixo : String(v.prefixo);
    const html = '<div class="bus-pin ' + estado + (tipo ? ' ' + tipo : '') + '">' +
      '<img class="bus-img" src="' + ICON_DIR + '/' + pasta + '/bus_' + String(ang).padStart(3, '0') + '.png" data-rot="' + ang + '" onerror="busImgFallback(this)" alt="">' +
      '<div class="bus-excl">!</div><div class="bus-badge">' + esc(txt) + '</div></div>';
    return { html, icon: L.divIcon({ className: '', iconSize: [0, 0], html }) };
  }

  function escala() {
    const z = map.getZoom(), c = map.getContainer();
    c.style.setProperty('--bus-size', (z >= 18 ? 76 : z >= 17 ? 66 : z >= 15 ? 56 : z >= 13 ? 46 : 38) + 'px');
    c.style.setProperty('--badge-fs', (z >= 15 ? 12 : 10) + 'px');
    c.classList.toggle('hide-badges', z < ESCONDER_BADGE_ABAIXO_ZOOM);
  }

  function sincronizarSelecao() {
    if (!itemSelecionado) return;
    const novo = busDataRaw.find((x) => x.prefixo === itemSelecionado.prefixo);
    if (novo && novo !== itemSelecionado) {
      const mudou = novo.linha !== itemSelecionado.linha || dirDe(novo) !== dirDe(itemSelecionado);
      itemSelecionado = novo;
      if (mudou) triggerRenderLines();
    }
  }

  function createPopupMonitor(v, specs, tipo) {
    const e = estadoDe(v), s = statusRota[v.prefixo];
    let head = 'Sem Linha';
    if (linhaTxt(v) === '0.001') head = 'TRANSFERÊNCIA';
    else if (ehVNR(v)) head = 'VNR';
    else if (linhaTxt(v)) head = 'Linha ' + linhaTxt(v);
    const aviso = e === 'semlinha' ? '⚠ Veículo sem linha no sistema'
      : e === 'fora' ? '⚠ Fora da rota (a ' + Math.round(s.dist) + ' m)'
      : e === 'sentido' ? '⚠ Sentido possivelmente invertido no sistema' : '';
    const row = (l, val) => '<div class="p-row"><span class="p-label">' + l + '</span><span class="p-val">' + val + '</span></div>';
    return '<div class="p-header ' + (tipo || '') + ' ' + (aviso ? 'alerta' : '') + '">' + esc(head) + '</div><div class="p-body">' +
      (aviso ? '<div class="p-alerta">' + aviso + '</div>' : '') +
      row('Prefixo', esc(v.prefixo)) + row('Modelo', esc(specs.modelo)) + row('Manutenção', esc(specs.manutencao)) + row('Operação', esc(specs.operacao)) +
      row('Sentido', esc(v.sentido || '--')) + row('Data', esc(v.data || '--')) + row('Hora', esc(v.hora || '--')) +
      '<div class="p-row"><span class="p-label">Status</span><span class="p-val" id="stat-' + esc(v.prefixo) + '">' + getLiveStatus(v.data, v.hora) + '</span></div>' +
      '<div class="divider"></div>' + row('Data Prev.', esc(v.dataProgramada || '--')) + row('Horário Prev.', esc(v.horaProgramada || '--')) + '</div>';
  }

  function renderMonitor() {
    const sel = (s) => Array.from(document.querySelectorAll(s + ':checked')).map((c) => c.value);
    const manut = sel('.chk-manutencao'), oper = sel('.chk-operacao'), mods = sel('.chk-modelo');
    const showLine = $('chk-com-linha').checked, showNoLine = $('chk-sem-linha').checked;
    const showTransfer = $('chk-transferencia').checked, showVNR = $('chk-VNR').checked;
    const soSem = $('chk-so-perdidos').checked, soFora = $('chk-so-fora').checked;
    sincronizarSelecao();
    const ids = new Set();

    busDataRaw.forEach((v) => {
      if (!Number.isFinite(v.latitude) || !Number.isFinite(v.longitude) || (!v.latitude && !v.longitude)) return;
      const specs = getVehicleSpecs(v.prefixo);
      const linha = linhaTxt(v);
      const isTransfer = linha === '0.001';
      const isVNR = ehVNR(v) || specs.core === 'VNR';
      const hasLine = !!linha && !isTransfer;

      if (itemSelecionado) {
        if (itemSelecionado.linha && v.linha !== itemSelecionado.linha) return;
        if (!itemSelecionado.linha && v.prefixo !== itemSelecionado.prefixo) return;
      }
      if (!isVNR) {
        if (manut.length && !manut.includes(specs.manutencao)) return;
        
        // Validação da Operação OU Linha pertencente ao setor filtrado
        if (oper.length) {
          const atendeOperacao = oper.includes(specs.operacao);
          const atendeLinhaSetor = oper.some(setor => LINHAS_POR_SETOR[setor] && LINHAS_POR_SETOR[setor].includes(linha));
          if (!atendeOperacao && !atendeLinhaSetor) return;
        }

        if (mods.length && !mods.includes(specs.modelo)) return;
      }
      if (termosBusca.length > 0) {
        const ok = termosBusca.some((t) => (v.prefixo && v.prefixo.includes(t)) || (v.linha && v.linha.includes(t)));
        if (!ok) return;
      }
      if (isTransfer && !showTransfer) return;
      if (isVNR && !showVNR) return;
      if (hasLine && !showLine) return;
      if (!linha && !showNoLine && !isVNR) return;

      const estado = estadoDe(v);
      const alerta = estado === 'fora' || estado === 'sentido' || estado === 'semlinha';
      if ((soSem || soFora) && !((soSem && estado === 'semlinha') || (soFora && (estado === 'fora' || estado === 'sentido')))) return;

      ids.add(v.prefixo);
      const pos = [v.latitude, v.longitude], core = specs.core, p = String(v.prefixo).trim();
      const zebra = core === 1130 || core === 1131 || core === 1132;
      const marrom = p.startsWith('7') || (typeof core === 'number' && core >= 1 && core <= 33);
      const tipo = zebra ? 'zebra' : marrom ? 'p7' : '';
      const pasta = zebra ? 'icones_vermelho' : marrom ? 'icones_marrom' : 'icones_verde';
      const ang = (Math.round(headingDe(v, pos) / 5) * 5) % 360;
      const b = buildIcon(v, estado, ang, tipo, pasta);
      const stale = ((Date.now() - parseDateBR(v.data, v.hora).getTime()) / 60000) > STALE_MIN;

      let m = markers[v.prefixo];
      if (m) {
        m.setLatLng(pos);
        m.vData = v; m.specs = specs; m.tipo = tipo;
        if (m._html !== b.html) { m.setIcon(b.icon); m._html = b.html; }
        const pp = m.getPopup();
        if (pp && pp.isOpen()) pp.update();
      } else {
        m = L.marker(pos, { icon: b.icon }).addTo(map);
        m._html = b.html; m.vData = v; m.specs = specs; m.tipo = tipo;
        m.bindPopup((layer) => createPopupMonitor(layer.vData, layer.specs, layer.tipo), { autoClose: false, closeOnClick: false, autoPan: false });
        
        m.on('click', () => {
          if (itemSelecionado && itemSelecionado.prefixo === m.vData.prefixo) { limparSelecao(); return; }
          if (currentOpenPopup && currentOpenPopup.isOpen()) map.closePopup(currentOpenPopup);
          itemSelecionado = m.vData;
          window.render(); triggerRenderLines();
          m.openPopup(); currentOpenPopup = m.getPopup();
        });
        m.on('popupclose', function () { if (currentOpenPopup === m.getPopup()) currentOpenPopup = null; });
        markers[v.prefixo] = m;
      }
      m.setZIndexOffset(alerta ? 4000 : 2000);
      m.setOpacity(stale ? 0.5 : 1);
    });

    Object.keys(markers).forEach((id) => { if (!ids.has(id)) { map.removeLayer(markers[id]); delete markers[id]; } });
    if (busDataRaw !== ultimaLista) { ultimaLista = busDataRaw; checarRotas(); }
  }

  // =====================================================================
  //  PAINEL MONITOR
  // =====================================================================
  function subTexto() {
    const el = $('mon-sub'); if (!el) return;
    if (progresso) el.textContent = progresso;
    else if (!ultimaVerificacao) el.textContent = 'Aguardando dados…';
    else el.textContent = 'Atualizado há ' + Math.max(0, Math.floor((Date.now() - ultimaVerificacao) / 1000)) + 's · raio de ' + RAIO_FORA_ROTA_M + ' m';
  }

  function atualizarPainel() {
    const r = resumo, fab = $('mon-fab'), txt = $('mon-fab-text');
    if (!r) { txt.textContent = 'Verificando rotas…'; return; }
    const perd = r.fora + r.sentido, partes = [];
    if (perd) partes.push(perd + ' fora da rota');
    if (r.semlinha) partes.push(r.semlinha + ' sem linha');
    txt.textContent = partes.length ? partes.join(' · ') : 'Todos na rota';
    fab.classList.toggle('alerta', partes.length > 0);
    subTexto();
    if (!$('mon-panel').classList.contains('open')) return;

    $('mon-stats').innerHTML =
      '<div class="mon-chip ok"><b>' + r.ok + '</b><small>Na rota</small></div>' +
      '<div class="mon-chip fora"><b>' + r.fora + '</b><small>Fora</small></div>' +
      '<div class="mon-chip sent"><b>' + r.sentido + '</b><small>Sent. errado</small></div>' +
      '<div class="mon-chip sl"><b>' + r.semlinha + '</b><small>Sem linha</small></div>';

    const peso = { sentido: 0, fora: 1, semlinha: 2 };
    const itens = busDataRaw.map((v) => ({ v, e: estadoDe(v) })).filter((x) => x.e in peso);
    const dist = (x) => (statusRota[x.v.prefixo] || {}).dist || 0;
    itens.sort((a, b) => peso[a.e] - peso[b.e] || dist(b) - dist(a));

    $('mon-list').innerHTML = itens.length ? itens.slice(0, 250).map((x) => {
      const v = x.v;
      const det = x.e === 'semlinha' ? 'Sem linha no sistema'
        : x.e === 'sentido' ? 'Sentido possivelmente invertido · sistema: ' + esc(v.sentido)
        : 'Fora da rota · a ' + Math.round(dist(x)) + ' m · ' + esc(v.sentido);
      const tit = linhaTxt(v) ? 'Linha ' + esc(linhaTxt(v)) + ' · ' + esc(v.prefixo) : 'Prefixo ' + esc(v.prefixo);
      return '<div class="mon-item" data-p="' + esc(v.prefixo) + '"><div class="mon-badge ' + (x.e === 'sentido' ? 'sentido' : '') + '">!</div>' +
        '<div class="mon-main">' + tit + '<small>' + det + '</small></div></div>';
    }).join('') : '<div class="mon-empty">✓ Nenhum conflito no momento</div>';
  }

  function painel(abrir) {
    const p = $('mon-panel');
    const open = typeof abrir === 'boolean' ? abrir : !p.classList.contains('open');
    p.classList.toggle('open', open);
    if (open) { controlPanel.classList.remove('open'); atualizarPainel(); }
  }

  function focar(prefixo) {
    const v = busDataRaw.find((x) => String(x.prefixo) === String(prefixo));
    if (!v) return;
    itemSelecionado = v;
    window.render(); triggerRenderLines();
    map.flyTo([v.latitude, v.longitude], Math.max(map.getZoom(), 16), { duration: 0.6 });
    const m = markers[v.prefixo];
    if (m) { m.openPopup(); currentOpenPopup = m.getPopup(); }
  }

  $('mon-fab').addEventListener('click', (e) => { e.stopPropagation(); painel(); });
  $('mon-close').addEventListener('click', () => painel(false));
  $('mon-panel').addEventListener('click', (e) => e.stopPropagation());
  $('mon-list').addEventListener('click', (e) => {
    const it = e.target.closest('.mon-item'); if (!it) return;
    focar(it.dataset.p);
    if (window.matchMedia('(max-width:600px)').matches) painel(false);
  });
  map.on('click', () => painel(false));
  btnToggleFilters.addEventListener('click', () => painel(false));

  const chkP = $('chk-so-perdidos'), chkF = $('chk-so-fora');
  [[chkP, 'soPerdidos'], [chkF, 'soFora']].forEach(([c, k]) => {
    c.checked = localStorage.getItem(k) === 'true';
    c.addEventListener('change', () => { localStorage.setItem(k, c.checked); window.render(); window.updateAppliedFiltersBadgeStack(); });
  });
  const updOriginal = window.updateAppliedFiltersBadgeStack;
  window.updateAppliedFiltersBadgeStack = function () {
    updOriginal();
    [[chkP, 'soPerdidos', 'Só sem linha'], [chkF, 'soFora', 'Só fora de rota']].forEach(([c, k, nome]) => {
      if (!c.checked) return;
      const b = document.createElement('div');
      b.className = 'applied-tag'; b.textContent = nome + ' ✕';
      b.onclick = () => { c.checked = false; localStorage.setItem(k, 'false'); window.render(); window.updateAppliedFiltersBadgeStack(); };
      $('applied-filters-stack').appendChild(b);
    });
  };

  // =====================================================================
  //  INICIALIZAÇÃO
  // =====================================================================
  window.render = renderMonitor;
  window.createPopup = createPopupMonitor;
  Object.keys(markers).forEach((id) => { map.removeLayer(markers[id]); delete markers[id]; });
  escala();
  map.on('zoomend', escala);
  setInterval(subTexto, 1000);
  window.render();
  window.updateAppliedFiltersBadgeStack();
})();

</script>
<script src="terminais-bsbus.js"></script>
